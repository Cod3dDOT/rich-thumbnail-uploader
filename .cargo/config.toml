# Windows 7+ (foobar2000's minimum). Tier 3 target: std is built from source.
[build]
target = "x86_64-win7-windows-msvc"

[unstable]
build-std = ["std", "panic_abort"]

# Link the C runtime statically: no VC++ redistributable needed, and Windows 7
# does not ship the UCRT. Its libs reference PDBs that are never shipped
# (LNK4099), which would fail builds with warnings denied.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-Ctarget-feature=+crt-static", "-Clink-arg=/IGNORE:4099"]

[target.x86_64-win7-windows-msvc]
linker = "rust-lld"

# 32-bit, for foobar2000 users on 32-bit Windows
[target.i686-win7-windows-msvc]
linker = "rust-lld"
