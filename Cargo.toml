[package]
name = "rich-thumbnail-uploader"
version = "0.3.3"
edition = "2024"
description = "Thumbnail uploader for foo_discord_rich"
readme = "README.md"
repository = "https://github.com/cod3ddot/rich-thumbnail-uploader"
license = "AGPL-3.0-or-later"
categories = ["command-line-utilities"]
publish = false

[package.metadata.winresource]
OriginalFilename = "rich-thumbnail-uploader.exe"
LegalCopyright = "Copyright © 2025 cod3ddot@proton.me"
FileDescription = "Thumbnail uploader for foo_discord_rich"

[dependencies]
attohttpc = {
  version = "0.31",
  default-features = false,
  features = [
    "multipart-form",
    "tls-native",
  ]
}
image = {
  version = "0.25",
  default-features = false,
  features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
  ]
}
pico-args = { version = "0.5" }
thiserror = { version = "2" }

[dev-dependencies]
tempfile = "3.10.1"

[build-dependencies]
winresource = "0.1"

[badges]
maintenance = { status = "passively-maintained" }

[lints.rust]
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
missing_debug_implementations = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "warn"
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
