# Build Windows binaries
name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  check-client-id:
    name: Check if imgur client id secret exists
    runs-on: ubuntu-latest
    env:
      IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
    steps:
      - name: Check secret exists
        if: ${{ env.IMGUR_CLIENT_ID == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('IMGUR_CLIENT_ID secret not set!')

  check-style:
    name: Check Style
    needs: [check-client-id]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run format check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v5

  build:
    name: Build Windows binary
    needs: [check-style]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rich-thumbnail-uploader-windows
          path: target/release/rich-thumbnail-uploader.exe

  create-release:
    name: Publish Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: rich-thumbnail-uploader-windows
          path: ./bin

      - name: Run UPX to reduce binary size
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: "./bin/rich-thumbnail-uploader.exe"
          args: -q --best --lzma

      - name: Generate SHA256 checksum
        run: |
          cd ./bin
          sha256sum rich-thumbnail-uploader.exe > rich-thumbnail-uploader.exe.sha256

      - name: Import GPG key
        if: ${{ env.GPG_SIGNING_KEY != '' }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          echo "${{ secrets.GPG_SIGNING_KEY }}" | gpg --batch --allow-secret-key-import --import

      - name: Sign the checksum file
        if: ${{ env.GPG_SIGNING_KEY != '' && env.GPG_PASSPHRASE != '' }}
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd ./bin
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ { print $5; exit }')
          gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --local-user "$KEY_ID" \
            --output rich-thumbnail-uploader.exe.sha256.asc \
            --detach-sign rich-thumbnail-uploader.exe.sha256

      - name: Extract latest changelog entry
        run: |
          if [ -f CHANGES.md ]; then
            awk '/^## \[/ { if (found) exit; found=1 } found' CHANGES.md > latest_changes.md
          else
            echo "Release ${{ github.ref_name }}" > latest_changes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/rich-thumbnail-uploader.exe
            bin/rich-thumbnail-uploader.exe.sha256
            bin/rich-thumbnail-uploader.exe.sha256.asc
          body_path: latest_changes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
