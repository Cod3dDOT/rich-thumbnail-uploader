name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

# Dependency build scripts run here; only the release job gets write access.
permissions:
  contents: read

jobs:
  check-reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v6

  check-style:
    name: Clippy, fmt, tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
            cache-shared-key: "check-style" # propagates to Swatinem/rust-cache
            rustflags: "" # Disable default rustflags to avoid conflicts

      - name: Run format check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build binary (${{ matrix.target }})
    needs: [check-reuse, check-style]
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - target: x86_64-win7-windows-msvc
            exe: rich-thumbnail-uploader.exe
          - target: i686-win7-windows-msvc
            exe: rich-thumbnail-uploader-x86.exe
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
            cache-shared-key: "build-${{ matrix.target }}" # propagates to Swatinem/rust-cache
            rustflags: "" # Disable default rustflags to avoid conflicts

      - name: Build release binary
        run: |
          set RUSTFLAGS=-Zlocation-detail=none -Zunstable-options -Cpanic=immediate-abort -Ctarget-feature=+crt-static
          cargo build --locked -Z build-std-features=optimize_for_size --release --target ${{ matrix.target }} || exit /b 1
          copy target\${{ matrix.target }}\release\rich-thumbnail-uploader.exe ${{ matrix.exe }}
        shell:
            cmd
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.exe }}
          path: ${{ matrix.exe }}

  create-release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download binary artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./bin
          merge-multiple: true

      - name: Run UPX to reduce binary size
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v5.2.1
          files: "./bin/*.exe"
          args: -q --best --lzma

      - name: Generate SHA256 checksums
        run: |
          cd ./bin
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done

      - name: Import GPG
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign the checksum files
        run: |
          cd bin
          export GPG_TTY="$(tty)"
          for f in *.sha256; do
            gpg --batch --yes \
                --local-user "${{ steps.gpg.outputs.fingerprint }}" \
                --output "$f.asc" \
                --detach-sign "$f"
          done

      - name: Generate release attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bin/*.exe

      - name: Extract latest changelog entry
        run: |
          if [ -f CHANGES.md ]; then
            awk '/^## \[/ { if (found) exit; found=1 } found' CHANGES.md > latest_changes.md
          else
            echo "Release ${{ github.ref_name }}" > latest_changes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.exe
            bin/*.sha256
            bin/*.sha256.asc
            ${{ steps.attest.outputs.bundle-path }}
          body_path: latest_changes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
