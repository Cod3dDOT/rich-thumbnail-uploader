name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  check-reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v6

  check-style:
    name: Clippy, fmt, tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install rust-toolchain.toml
        run: rustup toolchain install

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "check-style"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run format check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --all-features

  build:
    name: Build binary
    needs: [check-reuse, check-style]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install rust-toolchain.toml
        run: rustup toolchain install

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binary
        run: |
          set RUSTFLAGS=-Zlocation-detail=none -Zunstable-options -Cpanic=immediate-abort -Ctarget-feature=+crt-static
          cargo build --locked ^
          -Z build-std=std,panic_abort ^
          -Z build-std-features=optimize_for_size ^
          --target x86_64-pc-windows-msvc ^
          --release
        shell:
            cmd
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: rich-thumbnail-uploader.exe
          path: target/x86_64-pc-windows-msvc/release/rich-thumbnail-uploader.exe

  create-release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download binary artifact
        uses: actions/download-artifact@v6
        with:
          name: rich-thumbnail-uploader.exe
          path: ./bin

      - name: Run UPX to reduce binary size
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: "./bin/rich-thumbnail-uploader.exe"
          args: -q --best --lzma

      - name: Generate SHA256 checksum
        run: |
          cd ./bin
          sha256sum rich-thumbnail-uploader.exe > rich-thumbnail-uploader.exe.sha256

      - name: Import GPG
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign the checksum file
        run: |
          cd bin
          export GPG_TTY="$(tty)"
          gpg --batch --yes \
              --local-user "${{ steps.gpg.outputs.fingerprint }}" \
              --output rich-thumbnail-uploader.exe.sha256.asc \
              --detach-sign rich-thumbnail-uploader.exe.sha256

      - name: Generate release attestation
        id: attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: bin/rich-thumbnail-uploader.exe

      - name: Extract latest changelog entry
        run: |
          if [ -f CHANGES.md ]; then
            awk '/^## \[/ { if (found) exit; found=1 } found' CHANGES.md > latest_changes.md
          else
            echo "Release ${{ github.ref_name }}" > latest_changes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/rich-thumbnail-uploader.exe
            bin/rich-thumbnail-uploader.exe.sha256
            bin/rich-thumbnail-uploader.exe.sha256.asc
            ${{ steps.attest.outputs.bundle-path }}
          body_path: latest_changes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
